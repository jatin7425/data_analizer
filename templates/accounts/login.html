{% extends "base.html" %}

{% block title %}Log in - Excel Analyzer{% endblock %}

{% block body %}
<main class="auth">
    <div class="panel auth-card">
        <h1>Log in</h1>
        <p>Pick up where you left off with your workbooks.</p>
        <form method="post">
            {% csrf_token %}
            {% include "partials/form_fields.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
        <p class="auth-switch">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
    </div>
</main>
{% endblock %}
